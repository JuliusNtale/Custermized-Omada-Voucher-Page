services:

  omada:
    # Pinned (never :latest, per the project's own design goal) - see
    # Backend/docs/ARCHITECTURE.md for why: :latest is a moving target and a
    # major-version jump can change the Open API surface without warning.
    #
    # MUST stay on the v5.x line on this hardware (Raspberry Pi 4 / Cortex-A72):
    # v6+ images ship MongoDB 8, which requires armv8.2-a CPU support that the
    # Pi 4 does not have (container crash-loops with "your system does not
    # support the armv8.2-a or later microarchitecture" - see
    # https://github.com/mbentley/docker-omada-controller/blob/master/README.md#your-system-does-not-support-avx-or-armv82-a).
    # v5.15.24.19 (MongoDB 3.6) is also the exact version this backend's
    # omada.paths.ts / omada-openapi.json were verified against - see
    # Backend/README.md's "Omada endpoint verification" section.
    image: mbentley/omada-controller:5.15.24.19
    container_name: omada-controller
    restart: unless-stopped

    # Guardrail against a runaway JVM/MongoDB starving the Pi (3.7 GB total).
    # DISABLED until the memory cgroup is enabled on the Pi (Raspberry Pi OS
    # ships it off): add `cgroup_enable=memory cgroup_memory=1` to
    # /boot/firmware/cmdline.txt and reboot, then uncomment. Without that,
    # Docker prints "kernel does not support memory limit" and ignores it.
    # See DEPLOY.md "Memory ceilings".
    # mem_limit: 2g

    environment:
      TZ: Africa/Dar_es_Salaam

    volumes:
      - omada-data:/opt/tplink/EAPController/data
      - omada-logs:/opt/tplink/EAPController/logs

    ports:
      - "8043:8043"
      - "8088:8088"
      - "8843:8843"
      - "29810:29810/udp"
      - "29811:29811/tcp"
      - "29812:29812/tcp"
      - "29813:29813/tcp"
      - "29814:29814/tcp"
      - "29815:29815/tcp"
      - "29816:29816/tcp"
      - "29817:29817/tcp"
      - "27001:27001/udp"

    networks:
      - hotspot

  postgres:
    image: postgres:16-alpine
    container_name: backend-postgres
    restart: unless-stopped
    # mem_limit: 256m   # enable the memory cgroup first - see the omada service
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wifi_business
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hotspot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wifi_business"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Image is built OFF the Pi by .github/workflows/build-backend.yml and
    # pulled from GHCR - deploy is `docker compose pull backend && up -d`.
    # To build locally instead:
    #   docker compose -f docker-compose.yml -f docker-compose.build.yml build backend
    # Offline (no registry): scripts/backend-image-offline.sh  (save on a
    # build box, load on the Pi).
    image: ghcr.io/neuraltaletechnologies/omada-radius-server-backend:latest
    container_name: backend-api
    restart: unless-stopped
    # mem_limit: 320m   # enable the memory cgroup first - see the omada service
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      # Force production regardless of what Backend/.env says (that file is
      # also used for host-side `npm run dev`, which wants NODE_ENV=development
      # for pino-pretty - not installed in this production image).
      NODE_ENV: production
      # Bind all interfaces inside the container - Backend/.env's HOST=localhost
      # is for host-side `npm run dev`; a container bound to loopback is
      # unreachable through Docker's published port (connections get accepted
      # by the port-forwarding layer but dropped since nothing's listening on
      # the container's actual interface).
      HOST: 0.0.0.0
      # On the shared Docker network reach Omada by service name, not its IP.
      OMADA_BASE_URL: https://omada:8043
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wifi_business
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hotspot

  # Exposes ONLY the backend (its /api/payments/webhook) to the public
  # internet, via an outbound-only connection to Cloudflare - no router
  # port-forwarding, no inbound firewall holes. Omada is never routed here;
  # it stays LAN-only. See cloudflared/config.yml for the ingress rule and
  # Backend/README.md for how the tunnel/DNS route were created.
  cloudflared:
    # Pinned by digest (like omada/postgres) so a stray `docker compose pull`
    # can't swap the tunnel binary unexpectedly. This is cloudflared 2026.8.2.
    # To update: bump the tag, run `docker compose pull cloudflared`, copy the
    # new digest here from `docker images --digests`.
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: cloudflared-tunnel
    restart: unless-stopped
    # mem_limit: 128m   # enable the memory cgroup first - see the omada service
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    depends_on:
      - backend
    networks:
      - hotspot

volumes:
  omada-data:
  omada-logs:
  postgres-data:

networks:
  hotspot:
    driver: bridge
