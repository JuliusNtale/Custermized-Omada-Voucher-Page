# Cloudflare Tunnel config. Exposes ONLY the backend publicly:
#   - webhooks.neuraltale.com -> ClickPesa payment webhook (POST /api/payments/webhook)
#   - portal.neuraltale.com   -> the captive portal (Omada External Portal Server target)
# The Omada Controller is never routed here and stays LAN-only.
#
# tunnel id: wifi-backend-webhook (fde68d72-fc90-4345-bed6-b7f7ba287963)
# credentials-file is bind-mounted in from cloudflared/creds.json (gitignored
# - never commit it; it's equivalent to a password for this tunnel).
#
# DNS: each hostname needs a CNAME -> fde68d72-fc90-4345-bed6-b7f7ba287963.cfargotunnel.com
# (create with `cloudflared tunnel route dns <tunnel> <hostname>` or in the
# Cloudflare dashboard). Both hostnames point at the same backend:3000.
tunnel: fde68d72-fc90-4345-bed6-b7f7ba287963
credentials-file: /etc/cloudflared/creds.json

ingress:
  - hostname: webhooks.neuraltale.com
    service: http://backend:3000
  - hostname: portal.neuraltale.com
    service: http://backend:3000
  - service: http_status:404
